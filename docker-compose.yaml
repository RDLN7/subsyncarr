name: subsyncarr

services:
  subsyncarr:
    build:
      context: .
    image: subsyncarr:local
    container_name: subsyncarr
    env_file: .env
    ports:
      - '${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000'
    volumes:
      - ${DATA_PATH:-./data}:/app/data
      - ${MOVIES_PATH:-/media/movies}:/movies
      - ${TV_PATH:-/media/tv}:/tv
      - ${MEDIA_PATH:-/media}:/media
      # Mount each directory listed in SCAN_PATHS at the same container path.
      # - /volume1/media/movies:/movies
      # - /volume1/media/tv:/tv
    restart: unless-stopped
    mem_limit: 768m
    mem_reservation: 128m
    cpus: 2.0
    init: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
